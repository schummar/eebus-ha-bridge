configuration:
  grpc_port:
    name: gRPC port
    description: Port the gRPC API listens on. Enter the same value in the EEBUS integration.
  eebus_port:
    name: EEBUS port
    description: Port the EEBUS SHIP protocol listens on. The heat pump connects here.
  vendor:
    name: Vendor
    description: Vendor name announced over EEBUS.
  brand:
    name: Brand
    description: Brand name announced over EEBUS. This is what the heat pump's app shows.
  model:
    name: Model
    description: Model name announced over EEBUS.
  serial:
    name: Serial number
    description: >-
      Serial number announced over EEBUS. Leave empty to generate one on first
      start and keep it. Changing it may force re-pairing with the heat pump.
  ohpcf_enabled:
    name: Compressor flexibility (OHPCF)
    description: >-
      Enable the compressor-flexibility (OHPCF) client. Disable it when another
      energy manager (e.g. evcc) should control OHPCF - the heat pump grants
      the use case to the first client that claims it. Measurements and
      temperature control keep working either way.
  ship_log:
    name: SHIP protocol log
    description: >-
      Log SHIP/SPINE connection details (handshake, trust, aborts) from the
      EEBUS stack. Enable to diagnose a heat pump that does not connect.
  experimental_mgcp_provider:
    name: "Experimental: MGCP grid provider"
    description: >-
      Expose the experimental MGCP grid-connection-point provider so the heat pump can read the household balance and run its own PV-surplus energy management. Requires commissioning in the heat pump app (see README). Off by default.
